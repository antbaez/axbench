[project]
name = "axbench"
version = "0.1.0"
description = "Add your description here"
readme = "markdown_files/README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncio>=3.4.3",
    "datasets>=3.0.2",
    "einops>=0.8.0",
    "httpx>=0.27.2",
    "openai>=1.52.1",
    "pyvene>=0.1.8",
    "torch>=2.5.0",
    "transformers>=4.42.4,<5",
    "wandb>=0.18.5",
    "scikit-learn>=1.5.2",
    "seaborn>=0.12.2",
    "peft>=0.13.2",
    "jupyter>=1.1.1",
    "adjusttext>=1.3.0",
    "altair>=5.5.0",
    "umap-learn>=0.5.7",
    "hf-transfer>=0.1.9",
    "stanza>=1.14.0",
    "vllm==0.11.2",
    "bitsandbytes>=0.45.0",
    "plotnine",
    # Direct requirement, not just the override below: axbench/utils/plot_utils.py
    # imports it at package import time, so every script needs it present.
    "matplotlib==3.9.2",
]

[tool.uv]
# xgrammar 0.2.4 is a broken PyPI release for this platform: it ships
# macOS and linux-aarch64 wheels but no linux-x86_64 wheel, unlike every
# neighboring version. Pulled in transitively by vllm once transformers<5
# forces an older vllm; exclude it so the resolver falls back to 0.2.3.
#
# matplotlib is pinned to 3.9.2 (the version this repo's analysis notebooks
# were built against) because adding plotnine otherwise drags in a newer
# matplotlib whose font/glyph rendering garbles text drawn with the custom
# "P052" font family used in analyse.ipynb.
override-dependencies = ["xgrammar!=0.2.4", "matplotlib==3.9.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
